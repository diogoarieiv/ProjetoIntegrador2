<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetLab - Cadastro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background-color: #3b5998;
            padding: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            height: 80px;
        }
        h1 {
            color: #3b5998;
            font-size: 2rem;
            margin-top: 12rem;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .form-group {
            display: flex;
            align-items: center;
            width: 80%;
            margin-bottom: 10px;
            margin-left: 50px;
        }
        label {
            font-size: 1.2rem;
            color: #3b5998;
            margin-right: 10px;
            text-align: right;
            width: 30%;
        }
        input {
            width: 35%;
            padding: 8px;
            border: 2px solid #3b5998;
            border-radius: 5px;
            font-size: 1rem;
        }
        .button-container {
            margin-top: 20px;
        }
        .button {
            padding: 10px 20px;
            font-size: 1rem;
            color: white;
            background-color: #3b5998;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            margin: 10px;
        }
        .button:hover {
            background-color: #2d4373;
        }
        .footer {
            background-color: #3b5998;
            padding: 20px;
            text-align: center;
            color: white;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="logo.png" alt="FMP Logo">
        </div>
    </div>
    <div class="container">
        <h1>Cadastro</h1>
        <form>
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <div class="button-container">
                <button type="submit" class="button">Confirmar</button>
                <a href="index.html" class="button">Cancelar</a>
            </div>
        </form>
    </div>
    <footer class="footer">
        &copy; 2025 GetLab. Todos os direitos reservados.
    </footer>
</body>
</html>
