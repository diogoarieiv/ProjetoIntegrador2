<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetLab Home</title>
    <link rel="stylesheet" href="menu.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="../assets/logo.png" alt="FMP Logo">
        </div>
        <div class="nav">
            <nav class="navbar">
                <a href="menu.html">Home</a>
                <a href="laboratorios.html">Laboratórios</a>
                <a href="registro.html">Registro</a>
                <a href="#" id="btnSair">Sair</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <h1>Laboratórios Disponíveis</h1>
        <div id="cards-container" class="cards-container"></div>
    </div>
    <script>
        // Verificar se usuário está logado
        const usuarioLogado = JSON.parse(localStorage.getItem("usuario"));
        if (!usuarioLogado) {
            window.location.href = "login.html";
        }

        async function carregarLaboratorios() {
            const container = document.getElementById("cards-container");
            const usuario = JSON.parse(localStorage.getItem("usuario"));

            try {
                const response = await fetch("https://3000-ia3x6g61do0vm9a3z4wa8-4bea3717.manusvm.computer/api/laboratorios");
                const labs = await response.json();

                container.innerHTML = "";

                labs.forEach(lab => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <img src="../assets/computador.png" alt="Computador">
                        <h3>${lab.nome}</h3>
                    `;
                    container.appendChild(card);
                });

                // Botão de admin
                if (usuario && usuario.tipo === "admin") {
                    const btn = document.createElement("a");
                    btn.href = "criarLab.html"; // Corrigido para criarLab.html
                    btn.textContent = "+ Criar novo laboratório";
                    btn.className = "criar-btn";
                    container.appendChild(btn);
                }

            } catch (err) {
                console.error("Erro ao carregar laboratórios", err);
                container.innerHTML = 
                    `<p class="error">Erro ao carregar laboratórios. Tente novamente.</p>`;
            }
        }

        // Logout
        document.getElementById("btnSair").addEventListener("click", function(e) {
            e.preventDefault();
            localStorage.removeItem("usuario");
            localStorage.removeItem("laboratorioSelecionado");
            window.location.href = "index.html";
        });

        carregarLaboratorios();
    </script>

</body>
</html>
