<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetLab Home</title>
    <link rel="stylesheet" href="menu.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="../assets/logo.png" alt="FMP Logo">
        </div>
        <div class="nav">
            <nav class="navbar">
                <a href="menu.html">Home</a>
                <a href="laboratorios.html">Laboratórios</a>
                <a href="admin.html" id="adminLink" style="display: none;">Painel Admin</a>
                <a href="criarLab.html" id="criarLab" style="display: none;">Criar Laboratório</a>
                <a href="registro.html">Registro</a>
                <a href="#" id="btnSair">Sair</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <h1>Laboratórios Disponíveis</h1>
        <div id="cards-container" class="cards-container"></div>
    </div>
    <script>
      

        // Verificar se usuário está logado
        const usuarioLogado = JSON.parse(localStorage.getItem("usuario"));
        console.log('Usuário logado:', usuarioLogado);
        
        if (!usuarioLogado || !usuarioLogado.usuario) {
            console.log('Nenhum usuário encontrado no localStorage');
            window.location.href = "login.html";
        }

        // Mostrar link do admin se for admin
        console.log('Tipo do usuário:', usuarioLogado?.usuario?.tipo);
        if (usuarioLogado?.usuario?.tipo === "admin") {
            console.log('Usuário é admin, mostrando links administrativos');
            document.getElementById("adminLink").style.display = "inline";
            document.getElementById("criarLab").style.display = "inline";
        } else {
            console.log('Usuário não é admin');
        }

        async function carregarLaboratorios() {
            const container = document.getElementById("cards-container");
            const usuario = JSON.parse(localStorage.getItem("usuario"));

            try {
                const response = await fetch("http://localhost:3000/api/laboratorios");
                const labs = await response.json();

                container.innerHTML = "";

                labs.forEach(lab => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <img src="../assets/computador.png" alt="Computador" class="computador-branco">
                        <h3>${lab.nome}</h3>
                    `;
                    container.appendChild(card);
                });

                // Botão de admin
                if (usuario && usuario.tipo === "admin") {
                    const btn = document.createElement("a");
                    btn.href = "criarLab.html"; // Corrigido para criarLab.html
                    btn.textContent = "+ Criar novo laboratório";
                    btn.className = "criar-btn";
                    container.appendChild(btn);
                }

            } catch (err) {
                console.error("Erro ao carregar laboratórios", err);
                container.innerHTML =
                    `<p class="error">Erro ao carregar laboratórios. Tente novamente.</p>`;
            }
        }

        // Logout
        document.getElementById("btnSair").addEventListener("click", function (e) {
            e.preventDefault();
            localStorage.removeItem("usuario");
            localStorage.removeItem("laboratorioSelecionado");
            window.location.href = "index.html";
        });

        carregarLaboratorios();
    </script>

</body>

</html>
