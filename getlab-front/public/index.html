<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetLab - Reserva de Laboratórios</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="../assets/logo.png" alt="FMP Logo">
        </div>
    </div>

    <div class="container">
        <h1>GetLab</h1>
        <p>Reserva de laboratórios</p>
        <a href="login.html" class="button" id="btnEntrar">Entrar</a>
        <a href="cadastro.html" class="button" id="btnRegistrar">Registrar</a>
        <a href="menu.html" class="button" id="btnMenu" style="display: none;">Menu</a>
        <a href="#" class="button" id="btnSair" style="display: none;">Sair</a>
    </div>

    <footer class="footer">
        &copy; 2025 GetLab. Todos os direitos reservados
    </footer>

    <script>
        const usuarioLogado = JSON.parse(localStorage.getItem('usuario'));

        if (usuarioLogado) {
            document.getElementById('btnEntrar').style.display = 'none';
            document.getElementById('btnRegistrar').style.display = 'none';
            document.getElementById('btnSair').style.display = 'block';
            document.getElementById('btnMenu').style.display = 'block';

            const saudacao = document.createElement('p');
            saudacao.textContent = `Bem-vindo, ${usuarioLogado.nome}!`;
            document.querySelector('.container').appendChild(saudacao);
        }

        // Lógica de logout
        document.getElementById('btnSair').addEventListener('click', function (e) {
            e.preventDefault();
            localStorage.removeItem('usuario');
            location.reload();
        });
    </script>
</body>

</html>
