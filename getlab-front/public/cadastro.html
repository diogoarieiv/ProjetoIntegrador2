<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="cadastro.css">
    <title>GetLab - Cadastro</title>
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="../assets/logo.png" alt="FMP Logo">
        </div>
    </div>
    <div class="container">
        <h1>Cadastro</h1>
        <form id="cadastroForm">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <div class="button-container">
                <button type="submit" class="button">Confirmar</button>
                <a href="index.html" class="button">Cancelar</a>
            </div>
        </form>
    </div>
    <footer class="footer">
        &copy; 2025 GetLab. Todos os direitos reservados.
    </footer>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const senha = document.getElementById('senha').value.trim();

            // Validação do email para aceitar somente os domínios permitidos
            let tipo = null;
            if (email.endsWith('@fmpsc.edu.br')) {
                tipo = 'docente';
            } else if (email.endsWith('@admin.com')) {
                tipo = 'admin';
            } else {
                alert('Email inválido. Use @fmpsc.edu.br para docentes ou @admin.com para administradores.');
                return; // para não enviar o formulário
            }

            try {
                const response = await fetch('http://localhost:3000/api/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, telefone, senha, tipo })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Erro ao cadastrar usuário');
                }

                alert('Usuário cadastrado com sucesso!');
                this.reset();

            } catch (err) {
                alert('Falha no cadastro: ' + err.message);
                console.error(err);
            }
        });
    </script>
</body>

</html>
