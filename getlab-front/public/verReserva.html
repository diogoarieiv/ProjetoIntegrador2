<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetLab - Ver Reservas</title>
    <link rel="stylesheet" href="verReserva.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="../assets/logo.png" alt="FMP Logo">
        </div>
        <div class="nav">
            <nav class="navbar">
                <a href="menu.html">Home</a>
                <a href="laboratorios.html">Laboratórios</a>
                <a href="verReserva.html" class="active">Ver Reservas</a>
                <a href="registro.html">Registro</a>
                <a href="#" id="btnSair">Sair</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <div class="lab-info">
            <h1 id="labNome">Laboratório</h1>
            <p id="labDetalhes">Carregando informações...</p>
        </div>

        <div class="calendar-section">
            <div class="calendar-header">
                <h2>Calendário de Reservas</h2>
                <div class="legend">
                    <div class="legend-item">
                        <span class="color-box disponivel"></span>
                        <span>Disponível</span>
                    </div>
                    <div class="legend-item">
                        <span class="color-box ocupado"></span>
                        <span>Ocupado</span>
                    </div>
                    <div class="legend-item">
                        <span class="color-box pendente"></span>
                        <span>Pendente</span>
                    </div>
                </div>
            </div>

            <!-- Calendário -->
            <div class="calendar-container">
                <div class="calendar-nav">
                    <button id="prevMonth">&lt;</button>
                    <h3 id="currentMonth"></h3>
                    <button id="nextMonth">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Cabeçalhos dos dias da semana -->
                    <div class="day-header">Dom</div>
                    <div class="day-header">Seg</div>
                    <div class="day-header">Ter</div>
                    <div class="day-header">Qua</div>
                    <div class="day-header">Qui</div>
                    <div class="day-header">Sex</div>
                    <div class="day-header">Sáb</div>
                    <!-- Dias serão gerados via JavaScript -->
                </div>
            </div>

            <!-- Formulário de solicitação de reserva (somente para docentes) -->
            <div class="reserva-section" id="reservaSection" style="display: none;">
                <h3>Solicitar Reserva</h3>
                <form id="reservaForm">
                    <div class="form-group">
                        <label for="dataReserva">Data:</label>
                        <input type="date" id="dataReserva" required>
                    </div>
                    <div class="form-group">
                        <label for="horaInicio">Hora de Início:</label>
                        <input type="time" id="horaInicio" required>
                    </div>
                    <div class="form-group">
                        <label for="horaFim">Hora de Fim:</label>
                        <input type="time" id="horaFim" required>
                    </div>
                    <div class="form-group">
                        <label for="descricao">Descrição da Atividade:</label>
                        <textarea id="descricao" rows="3" placeholder="Descreva a atividade que será realizada..." required></textarea>
                    </div>
                    <button type="submit" class="btn-solicitar">Solicitar Reserva</button>
                </form>
            </div>

            <!-- Seção de visualização de todas as reservas -->
            <div class="ver-reservas-section">
                <h3>Reservas do Laboratório</h3>
                <table class="tabela-reservas">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Horário</th>
                            <th>Descrição</th>
                            <th>Responsável</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="listaReservas">
                        <!-- Reservas serão carregadas dinamicamente via JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <footer class="footer">
        &copy; 2025 GetLab. Todos os direitos reservados
    </footer>

    <script src="verReserva_script.js"></script>
</body>
</html>
