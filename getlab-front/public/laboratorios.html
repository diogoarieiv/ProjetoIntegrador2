<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetLab - Laboratórios</title>
    <link rel="stylesheet" href="laboratorios.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="../assets/logo.png" alt="FMP Logo">
        </div>
        <div class="nav">
            <nav class="navbar">
                <a href="menu.html">Home</a>
                <a href="laboratorios.html" class="active">Laboratórios</a>
                <a href="registro.html">Registro</a>
                <a href="#" id="btnSair">Sair</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <h1>Laboratórios Disponíveis</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar laboratório...">
            <button id="searchBtn">🔍</button>
        </div>
        <div id="cards-container" class="cards-container">
            <!-- Cards serão carregados dinamicamente -->
        </div>
    </div>

    <footer class="footer">
        &copy; 2025 GetLab. Todos os direitos reservados
    </footer>

    <script>
        // Verificar se usuário está logado
        const usuarioLogado = JSON.parse(localStorage.getItem('usuario'));
        if (!usuarioLogado) {
            window.location.href = 'login.html';
        }

        // Função para carregar laboratórios
        async function carregarLaboratorios() {
            const container = document.getElementById('cards-container');
            
            try {
                const response = await fetch("https://3000-ia3x6g61do0vm9a3z4wa8-4bea3717.manusvm.computer/api/laboratorios");
                const labs = await response.json();

                container.innerHTML = '';

                labs.forEach(lab => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // Verificar status de reserva (simulado por enquanto)
                    const statusReserva = Math.random() > 0.5 ? 'disponivel' : 'ocupado';
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="status-indicator ${statusReserva}"></div>
                            <h3>${lab.nome}</h3>
                        </div>
                        <div class="card-body">
                            <div class="info-item">
                                <span class="label">Capacidade:</span>
                                <span class="value">${lab.capacidade} pessoas</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Recursos:</span>
                                <div class="recursos">
                                    ${lab.recursos.map(recurso => `<span class="recurso-tag">${recurso}</span>`).join('')}
                                </div>
                            </div>
                            <div class="status-text">
                                <span class="status ${statusReserva}">
                                    ${statusReserva === 'disponivel' ? '✓ Disponível' : '⏰ Ocupado'}
                                </span>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button class="btn-reservar" onclick="verReservas(${lab.id}, '${lab.nome}')">
                                Ver Reservas
                            </button>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Erro ao carregar laboratórios:', error);
                container.innerHTML = '<p class="error">Erro ao carregar laboratórios. Tente novamente.</p>';
            }
        }

        // Função para filtrar laboratórios
        function filtrarLaboratorios() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            
            cards.forEach(card => {
                const nomelab = card.querySelector('h3').textContent.toLowerCase();
                if (nomelab.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Função para redirecionar para página de reservas
        function verReservas(labId, labNome) {
            localStorage.setItem('laboratorioSelecionado', JSON.stringify({
                id: labId,
                nome: labNome
            }));
            window.location.href = 'verReserva.html';
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', filtrarLaboratorios);
        document.getElementById('searchBtn').addEventListener('click', filtrarLaboratorios);

        // Logout
        document.getElementById('btnSair').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('usuario');
            localStorage.removeItem('laboratorioSelecionado');
            window.location.href = 'index.html';
        });

        // Carregar laboratórios ao carregar a página
        document.addEventListener('DOMContentLoaded', carregarLaboratorios);
    </script>
</body>
</html>
