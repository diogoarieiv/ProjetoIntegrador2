<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetLab - Painel Admin</title>
    <link rel="stylesheet" type="text/css" href="admin.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="../assets/logo.png" alt="FMP Logo">
        </div>
        <div class="nav">
            <nav class="navbar">
                <a href="laboratorios.html">Laboratórios</a>
                <a href="admin.html" class="active">Painel Admin</a>
                <a href="registro.html">Registro</a>
                <a href="#" id="btnSair">Sair</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <h1>Painel Administrativo</h1>
        <p>Gerencie as solicitações de reserva de laboratórios</p>

        <div class="admin-section">
            <div class="section-header">
                <h2>Solicitações Pendentes</h2>
                <button id="btnAtualizar" class="btn-atualizar">Atualizar</button>
            </div>

            <div id="solicitacoes-container" class="solicitacoes-container">
                <!-- Solicitações serão carregadas dinamicamente -->
            </div>
        </div>

        <div class="admin-section">
            <div class="section-header">
                <h2>Histórico de Reservas</h2>
                <div class="filtros">
                    <select id="filtroStatus">
                        <option value="">Todos os status</option>
                        <option value="aprovado">Aprovado</option>
                        <option value="recusado">Recusado</option>
                        <option value="pendente">Pendente</option>
                    </select>
                    <input type="date" id="filtroData" placeholder="Filtrar por data">
                </div>
            </div>

            <div id="historico-container" class="historico-container">
                <!-- Histórico será carregado dinamicamente -->
            </div>
        </div>
    </div>

    <footer class="footer">
        &copy; 2025 GetLab. Todos os direitos reservados
    </footer>

    <script>
        // Verificar se usuário está logado e é admin
        const usuarioLogado = JSON.parse(localStorage.getItem("usuario"));
        if (!usuarioLogado || !usuarioLogado.usuario) {
            window.location.href = "login.html";
        }

        // Verificar se é admin
        if (usuarioLogado.usuario.tipo !== "admin") {
            alert("Acesso negado. Apenas administradores podem acessar esta página.");
            window.location.href = "menu.html";
        }

        // Função para carregar solicitações pendentes
        async function carregarSolicitacoesPendentes() {
            const container = document.getElementById("solicitacoes-container");
            
            try {
                const response = await fetch("http://localhost:3000/api/reservas/pendentes");
                const solicitacoes = await response.json();

                container.innerHTML = "";

                if (solicitacoes.length === 0) {
                    container.innerHTML = "<p class='no-data'>Nenhuma solicitação pendente encontrada.</p>";
                    return;
                }

                solicitacoes.forEach(solicitacao => {
                    const card = document.createElement("div");
                    card.className = "solicitacao-card";
                    
                    const dataFormatada = new Date(solicitacao.data).toLocaleDateString("pt-BR");
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <h3>${solicitacao.laboratorio.nome}</h3>
                            <span class="status-badge pendente">Pendente</span>
                        </div>
                        <div class="card-body">
                            <div class="info-row">
                                <span class="label">Solicitante:</span>
                                <span class="value">${solicitacao.usuario.nome}</span>
                            </div>
                            <div class="info-row">
                                <span class="label">Email:</span>
                                <span class="value">${solicitacao.usuario.email}</span>
                            </div>
                            <div class="info-row">
                                <span class="label">Data:</span>
                                <span class="value">${dataFormatada}</span>
                            </div>
                            <div class="info-row">
                                <span class="label">Horário:</span>
                                <span class="value">${solicitacao.horaInicio} - ${solicitacao.horaFim}</span>
                            </div>
                            <div class="info-row">
                                <span class="label">Descrição:</span>
                                <span class="value">${solicitacao.descricao}</span>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-aprovar" onclick="aprovarSolicitacao(${solicitacao.id})">
                                Aprovar
                            </button>
                            <button class="btn-recusar" onclick="recusarSolicitacao(${solicitacao.id})">
                                Recusar
                            </button>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Erro ao carregar solicitações:", error);
                container.innerHTML = "<p class='error'>Erro ao carregar solicitações. Tente novamente.</p>";
            }
        }

        // Função para carregar histórico de reservas
        async function carregarHistorico() {
            const container = document.getElementById("historico-container");
            
            try {
                const response = await fetch("http://localhost:3000/api/reservas");
                const reservas = await response.json();

                container.innerHTML = "";

                if (reservas.length === 0) {
                    container.innerHTML = "<p class='no-data'>Nenhuma reserva encontrada.</p>";
                    return;
                }

                // Aplicar filtros
                const filtroStatus = document.getElementById("filtroStatus").value;
                const filtroData = document.getElementById("filtroData").value;

                let reservasFiltradas = reservas;

                if (filtroStatus) {
                    reservasFiltradas = reservasFiltradas.filter(r => r.status === filtroStatus);
                }

                if (filtroData) {
                    const dataFiltro = new Date(filtroData);
                    reservasFiltradas = reservasFiltradas.filter(r => {
                        const dataReserva = new Date(r.data);
                        return dataReserva.toDateString() === dataFiltro.toDateString();
                    });
                }

                reservasFiltradas.forEach(reserva => {
                    const row = document.createElement("div");
                    row.className = "historico-row";
                    
                    const dataFormatada = new Date(reserva.data).toLocaleDateString("pt-BR");
                    
                    row.innerHTML = `
                        <div class="historico-info">
                            <span class="laboratorio">${reserva.laboratorio.nome}</span>
                            <span class="usuario">${reserva.usuario.nome}</span>
                            <span class="data">${dataFormatada} - ${reserva.horaInicio} às ${reserva.horaFim}</span>
                        </div>
                        <div class="historico-status">
                            <span class="status-badge ${reserva.status}">${reserva.status.charAt(0).toUpperCase() + reserva.status.slice(1)}</span>
                            ${reserva.status === "aprovado" ? 
                                `<button class="btn-cancelar" onclick="cancelarReserva(${reserva.id})">Cancelar</button>` : 
                                ''}
                        </div>
                    `;
                    
                    container.appendChild(row);
                });

            } catch (error) {
                console.error("Erro ao carregar histórico:", error);
                container.innerHTML = "<p class='error'>Erro ao carregar histórico. Tente novamente.</p>";
            }
        }

        // Função para aprovar solicitação
        async function aprovarSolicitacao(id) {
            try {
                const response = await fetch(`http://localhost:3000/api/reservas/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ status: "aprovado" })
                });

                if (response.ok) {
                    // Registrar a ação no sistema
                    const reserva = await response.json();
                    await registrarAcao({
                        docente: reserva.usuario.nome,
                        email: reserva.usuario.email,
                        data: new Date().toISOString(),
                        status: "Reserva aprovada",
                        detalhes: `Reserva do laboratório ${reserva.laboratorio.nome} para ${new Date(reserva.data).toLocaleDateString('pt-BR')} das ${reserva.horaInicio} às ${reserva.horaFim} foi aprovada`
                    });

                    alert("Solicitação aprovada com sucesso!");
                    carregarSolicitacoesPendentes();
                    carregarHistorico();
                } else {
                    alert("Erro ao aprovar solicitação. Tente novamente.");
                }
            } catch (error) {
                console.error("Erro:", error);
                alert("Erro ao conectar com o servidor.");
            }
        }

        // Função para recusar solicitação
        async function recusarSolicitacao(id) {
            const motivo = prompt("Por favor, informe o motivo da recusa:");
            if (motivo === null) return; // Usuário cancelou
            
            if (motivo.trim() === "") {
                alert("É necessário informar um motivo para a recusa.");
                return;
            }

            if (confirm("Tem certeza que deseja recusar esta solicitação?")) {
                try {
                    const response = await fetch(`http://localhost:3000/api/reservas/${id}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ 
                            status: "recusado",
                            motivo: motivo
                        })
                    });

                    if (response.ok) {
                        // Registrar a ação no sistema
                        const reserva = await response.json();
                        await registrarAcao({
                            docente: reserva.usuario.nome,
                            email: reserva.usuario.email,
                            data: new Date().toISOString(),
                            status: "Reserva recusada",
                            detalhes: `Reserva do laboratório ${reserva.laboratorio.nome} para ${new Date(reserva.data).toLocaleDateString('pt-BR')} das ${reserva.horaInicio} às ${reserva.horaFim} foi recusada. Motivo: ${motivo}`
                        });

                        alert("Solicitação recusada.");
                        carregarSolicitacoesPendentes();
                        carregarHistorico();
                    } else {
                        alert("Erro ao recusar solicitação. Tente novamente.");
                    }
                } catch (error) {
                    console.error("Erro:", error);
                    alert("Erro ao conectar com o servidor.");
                }
            }
        }

        // Função para cancelar reserva aprovada
        async function cancelarReserva(id) {
            const motivo = prompt("Por favor, informe o motivo do cancelamento:");
            if (motivo === null) return; // Usuário cancelou
            
            if (motivo.trim() === "") {
                alert("É necessário informar um motivo para o cancelamento.");
                return;
            }

            if (confirm("Tem certeza que deseja cancelar esta reserva?")) {
                try {
                    const response = await fetch(`http://localhost:3000/api/reservas/${id}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ 
                            status: "cancelado",
                            motivo: motivo
                        })
                    });

                    if (response.ok) {
                        // Registrar a ação no sistema
                        const reserva = await response.json();
                        await registrarAcao({
                            docente: reserva.usuario.nome,
                            email: reserva.usuario.email,
                            data: new Date().toISOString(),
                            status: "Reserva cancelada",
                            detalhes: `Reserva do laboratório ${reserva.laboratorio.nome} para ${new Date(reserva.data).toLocaleDateString('pt-BR')} das ${reserva.horaInicio} às ${reserva.horaFim} foi cancelada. Motivo: ${motivo}`
                        });

                        alert("Reserva cancelada com sucesso.");
                        carregarSolicitacoesPendentes();
                        carregarHistorico();
                    } else {
                        alert("Erro ao cancelar reserva. Tente novamente.");
                    }
                } catch (error) {
                    console.error("Erro:", error);
                    alert("Erro ao conectar com o servidor.");
                }
            }
        }

        // Função para registrar ações no sistema
        async function registrarAcao(registro) {
            try {
                await fetch("http://localhost:3000/api/registros", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(registro)
                });
            } catch (error) {
                console.error("Erro ao registrar ação:", error);
            }
        }

        // Event listeners
        document.getElementById("btnAtualizar").addEventListener("click", function() {
            carregarSolicitacoesPendentes();
            carregarHistorico();
        });

        document.getElementById("filtroStatus").addEventListener("change", carregarHistorico);
        document.getElementById("filtroData").addEventListener("change", carregarHistorico);

        // Logout
        document.getElementById("btnSair").addEventListener("click", function(e) {
            e.preventDefault();
            localStorage.removeItem("usuario");
            window.location.href = "index.html";
        });

        // Carregar dados ao carregar a página
        document.addEventListener("DOMContentLoaded", function() {
            carregarSolicitacoesPendentes();
            carregarHistorico();
        });
    </script>
</body>
</html>
