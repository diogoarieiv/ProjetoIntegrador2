<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetLab - Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="../assets/logo.png" alt="FMP Logo">
        </div>
    </div>
    <div class="container">
        <h1>Login</h1>
        <form>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <div class="button-container">
                <button type="submit" class="button">Confirmar</button>
                <a href="index.html" class="button">Cancelar</a>
            </div>
        </form>
    </div>
    <footer class="footer">
        &copy; 2025 GetLab. Todos os direitos reservados.
    </footer>
    <script>
        document.querySelector('form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();

            try {
                const response = await fetch("http://localhost:3000/api/login", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao fazer login');
                }

                // Debug logs
                console.log('Dados recebidos do servidor:', data);
                
                // Salvar dados no localStorage
                localStorage.setItem('usuario', JSON.stringify(data));
                
                // Verificar se os dados foram salvos
                const usuarioSalvo = localStorage.getItem('usuario');
                console.log('Dados salvos no localStorage:', usuarioSalvo);

                // Redirecionar para menu
                window.location.href = 'laboratorios.html';

            } catch (err) {
                alert('Falha no login: ' + err.message);
                console.error(err);
            }
        });
    </script>


</body>

</html>
